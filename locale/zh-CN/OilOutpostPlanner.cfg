[mod-setting-name]
oil-outpost-planner-interface-with-module-inserter-ex=插入模块
oil-outpost-planner-num-columns=规划器设置界面中每行按钮数

[mod-setting-description]
oil-outpost-planner-interface-with-module-inserter-ex=使用“插入模块”的配置，将模块添加到已放置的虚影实体上。
oil-outpost-planner-num-columns=规划器设置界面中每行的按钮数量。如果你使用宽屏显示器且安装了大量模组，可以适当增加此数值。

